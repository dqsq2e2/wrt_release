name: CI Maintenance

on:
  schedule:
    - cron: "23 20 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: ci-maintenance
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Prune Old Dependency Caches
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '14 days ago' +%s)
          gh cache list --limit 10000 --json key,lastAccessedAt | jq -r '.[] | [.key, .lastAccessedAt] | @tsv' | \
          while IFS=$'\t' read -r key last_accessed; do
            [[ "$key" == upstream-watch-* ]] && continue
            cache_time=$(date -u -d "$last_accessed" +%s)
            if (( cache_time < cutoff )); then
              echo "Deleting cache: $key"
              gh cache delete "$key"
            fi
          done

      - name: Keep Recent Upstream Markers
        run: |
          set -euo pipefail
          for model in MEDIATEK-WIFI-YES MEDIATEK-WIFI-NO clx_s20p_immwrt jdcloud_ax6000_immwrt; do
            gh cache list --key "upstream-watch-$model-" --limit 100 --json key,createdAt | \
              jq -r 'sort_by(.createdAt) | reverse | .[5:] | .[].key' | \
              while read -r key; do
                if [[ -n "$key" ]]; then
                  gh cache delete "$key"
                fi
              done
          done

      - name: Prune Old Workflow Runs
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '3 days ago' +%s)
          deleted_count=0

          # High-frequency workflows (Upstream Watch: every 6h + push triggers,
          # often cancelled+rerun) accumulate dozens of runs inside any time
          # window. Keep only the newest N completed runs for them.
          keep_latest=10
          for wf in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows" --jq '.workflows[] | select(.name == "Upstream Watch") | .id'); do
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?per_page=100" \
              --jq '.workflow_runs[] | select(.status == "completed") | [.id, .created_at] | @tsv' | \
            sort -t "$(printf '\t')" -k2 -r | tail -n +$((keep_latest + 1)) | \
            while IFS=$'\t' read -r run_id _; do
              [ -z "$run_id" ] && continue
              echo "Deleting old Upstream Watch run: $run_id"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
                && deleted_count=$((deleted_count + 1)) \
                || echo "WARN: delete failed for run $run_id"
            done
          done

          # Everything else: delete completed runs older than the cutoff.
          run_list=$(mktemp)
          trap 'rm -f "$run_list"' EXIT

          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed") | [.id, .created_at] | @tsv' > "$run_list"

          while IFS=$'\t' read -r run_id created_at; do
            run_time=$(date -u -d "$created_at" +%s)
            if (( run_time < cutoff )); then
              echo "Deleting workflow run: $run_id"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
                && deleted_count=$((deleted_count + 1)) \
                || echo "WARN: delete failed for run $run_id"
            fi
          done < "$run_list"

          echo "Deleted $deleted_count workflow runs."
          echo "- Deleted workflow runs: $deleted_count" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep Recent Monitored Releases
        run: |
          set -euo pipefail
          for model in MEDIATEK-WIFI-YES MEDIATEK-WIFI-NO clx_s20p_immwrt jdcloud_ax6000_immwrt; do
            gh release list --limit 100 --json tagName,publishedAt | \
              jq -r --arg suffix "_$model" 'sort_by(.publishedAt) | reverse | map(select(.tagName | endswith($suffix))) | .[2:] | .[].tagName' | \
              while read -r tag; do
                if [[ -n "$tag" ]]; then
                  echo "Deleting release: $tag"
                  gh release delete "$tag" --cleanup-tag --yes
                fi
              done
          done
